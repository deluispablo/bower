# Copied into the operator's instance repo under .github/workflows/ by the
# setup script (M4). This public repo never runs it: these files live
# under agent/workflows/, not .github/workflows/, so CI never picks them up.
#
# Runs agent/run.sh in lint mode (the weekly health check). On schedule,
# every Sunday at 06:17 UTC, the `list` job asks the Worker for every vault
# id and the `lint` job runs once per vault, one at a time. A manual run
# (workflow_dispatch) lints the single vault it is given and skips `list`.
name: Lint vault

on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:
    inputs:
      vault_id:
        description: Vault to lint (the user id from the Worker)
        required: true
        type: string

jobs:
  list:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      vaults: ${{ steps.list.outputs.vaults }}
    steps:
      # The answer holds opaque user ids only; the log prints just the count.
      - name: List vaults
        id: list
        env:
          BOWER_API_URL: ${{ vars.BOWER_API_URL }}
          BOWER_API_KEY: ${{ secrets.BOWER_API_KEY }}
        run: |
          curl -fsS -o vaults.json \
            -H "Authorization: Bearer $BOWER_API_KEY" \
            "${BOWER_API_URL%/}/runner/vaults"
          vaults=$(jq -c '[.vaults[].id]' vaults.json)
          echo "vaults=$vaults" >> "$GITHUB_OUTPUT"
          echo "$(jq length <<<"$vaults") vaults to lint"

  lint:
    needs: list
    # Runs after `list` on schedule, and on its own when `list` is skipped
    # (a manual run). Nothing to do when no user has a vault yet.
    if: >-
      !cancelled() &&
      (needs.list.result == 'success' || needs.list.result == 'skipped') &&
      (github.event_name != 'schedule' || needs.list.outputs.vaults != '[]')
    strategy:
      # One vault at a time: the runs share the operator's Claude credential.
      # One failing vault (for example, Google access revoked) does not
      # cancel the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        vault_id: ${{ fromJSON(github.event_name == 'schedule' && needs.list.outputs.vaults || format('[{0}]', toJSON(inputs.vault_id))) }}
    concurrency:
      group: lint-${{ matrix.vault_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VAULT_ID: ${{ matrix.vault_id }}
      # Both pinned deliberately; the cache keys below derive from these,
      # so bumping a version here invalidates the matching cache too.
      BOWER_RCLONE_VERSION: '1.75.1'
      BOWER_RCLONE_SHA256: '982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab'
      CLAUDE_CODE_VERSION: '2.1.283'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache rclone
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: ~/rclone-bin
          key: rclone-${{ runner.os }}-${{ env.BOWER_RCLONE_VERSION }}

      # Official release, downloaded directly and verified by hash rather
      # than through a third-party action: BOWER_RCLONE_SHA256 is the
      # linux-amd64.zip line copied from that release's own SHA256SUMS
      # (https://github.com/rclone/rclone/releases/download/v1.75.1/SHA256SUMS).
      - name: Download rclone
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o rclone.zip \
            "https://github.com/rclone/rclone/releases/download/v${BOWER_RCLONE_VERSION}/rclone-v${BOWER_RCLONE_VERSION}-linux-amd64.zip"
          echo "${BOWER_RCLONE_SHA256}  rclone.zip" | sha256sum -c -
          unzip -q rclone.zip
          mkdir -p ~/rclone-bin
          install -m 755 "rclone-v${BOWER_RCLONE_VERSION}-linux-amd64/rclone" ~/rclone-bin/rclone
          rm -rf rclone.zip "rclone-v${BOWER_RCLONE_VERSION}-linux-amd64"

      - name: Install rclone
        run: |
          sudo install -m 755 ~/rclone-bin/rclone /usr/local/bin/rclone
          rclone version

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Claude Code CLI
        id: cache-claude-cli
        uses: actions/cache@v4
        with:
          path: ~/claude-cli
          key: claude-code-${{ runner.os }}-${{ env.CLAUDE_CODE_VERSION }}

      # Installed into a project-local prefix, not global, so the whole
      # thing is one directory the cache step above can save and restore.
      # Pinned to the version current when this workflow was written
      # (npm view @anthropic-ai/claude-code version); bump deliberately.
      - name: Install Claude Code
        if: steps.cache-claude-cli.outputs.cache-hit != 'true'
        run: npm install --prefix "$HOME/claude-cli" @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}

      - name: Add Claude Code to PATH
        run: echo "$HOME/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"

      # run.sh's own log carries timestamps, step names and counts only and
      # never prints a credential, so no ::add-mask:: is needed here.
      - name: Run lint
        env:
          BOWER_API_URL: ${{ vars.BOWER_API_URL }}
          BOWER_API_KEY: ${{ secrets.BOWER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Unset by default: the agent gets no web tools (see run.sh).
          BOWER_ALLOW_WEB: ${{ vars.BOWER_ALLOW_WEB }}
        run: bash agent/run.sh "$VAULT_ID" lint

      # rclone's log and the agent's stderr, kept out of the job log itself
      # (see agent/README.md); may hold vault content, so this repo is
      # private and the retention is short.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # One artifact per matrix leg; artifact names must be unique per run.
          name: bower-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/bower-logs/
          retention-days: 3
          if-no-files-found: ignore
