# Copied into the operator's instance repo under .github/workflows/ by the
# setup script (M4). This public repo never runs it: these files live
# under agent/workflows/, not .github/workflows/, so CI never picks them up.
#
# Runs agent/run.sh in lint mode (the weekly health check). Started only by
# the Worker: its cron trigger (Sundays at 06:17 UTC, api/wrangler.toml)
# sends one repository_dispatch (bower-lint) per vault, each with that
# run's own ticket (issues #259 and #292). This workflow has no schedule, no
# manual trigger and holds no Worker key: anyone who can edit it can run the
# agent on a vault only when the Worker dispatches it, and can never make the
# Worker dispatch. To lint one vault by hand, call POST /runner/lint/dispatch
# with the admin key (docs/runbook.md).
#
# Each vault's run is its own workflow run, so they run side by side rather
# than one at a time.
name: Lint vault

on:
  repository_dispatch:
    types: [bower-lint]

jobs:
  lint:
    if: github.event_name == 'repository_dispatch'
    concurrency:
      group: lint-${{ github.event.client_payload.vault_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VAULT_ID: ${{ github.event.client_payload.vault_id }}
      # All pinned deliberately; the cache keys below derive from these,
      # so bumping a version here invalidates the matching cache too.
      BOWER_RCLONE_VERSION: '1.75.1'
      BOWER_RCLONE_SHA256: '982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab'
      BOWER_PANDOC_VERSION: '3.1.3'
      BOWER_PANDOC_SHA256: '74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d'
      CLAUDE_CODE_VERSION: '2.1.283'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache rclone
        id: cache-rclone
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/rclone-bin
          key: rclone-${{ runner.os }}-${{ env.BOWER_RCLONE_VERSION }}

      # Official release, downloaded directly and verified by hash rather
      # than through a third-party action: BOWER_RCLONE_SHA256 is the
      # linux-amd64.zip line copied from that release's own SHA256SUMS
      # (https://github.com/rclone/rclone/releases/download/v1.75.1/SHA256SUMS).
      - name: Download rclone
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o rclone.zip \
            "https://github.com/rclone/rclone/releases/download/v${BOWER_RCLONE_VERSION}/rclone-v${BOWER_RCLONE_VERSION}-linux-amd64.zip"
          echo "${BOWER_RCLONE_SHA256}  rclone.zip" | sha256sum -c -
          unzip -q rclone.zip
          mkdir -p ~/rclone-bin
          install -m 755 "rclone-v${BOWER_RCLONE_VERSION}-linux-amd64/rclone" ~/rclone-bin/rclone
          rm -rf rclone.zip "rclone-v${BOWER_RCLONE_VERSION}-linux-amd64"

      - name: Install rclone
        run: |
          sudo install -m 755 ~/rclone-bin/rclone /usr/local/bin/rclone
          rclone version

      - name: Cache pandoc
        id: cache-pandoc
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/pandoc-bin
          key: pandoc-${{ runner.os }}-${{ env.BOWER_PANDOC_VERSION }}

      # Official release, downloaded directly and verified by hash, like
      # rclone. 3.1.3 is the version apt installed on ubuntu-latest, so the
      # conversions in run.sh (which need --sandbox, pandoc 2.15+) do not
      # change. pandoc publishes no checksum file for this release:
      # BOWER_PANDOC_SHA256 is the sha256sum of
      # https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-linux-amd64.tar.gz.
      - name: Download pandoc
        if: steps.cache-pandoc.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o pandoc.tar.gz \
            "https://github.com/jgm/pandoc/releases/download/${BOWER_PANDOC_VERSION}/pandoc-${BOWER_PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${BOWER_PANDOC_SHA256}  pandoc.tar.gz" | sha256sum -c -
          tar -xzf pandoc.tar.gz
          mkdir -p ~/pandoc-bin
          install -m 755 "pandoc-${BOWER_PANDOC_VERSION}/bin/pandoc" ~/pandoc-bin/pandoc
          rm -rf pandoc.tar.gz "pandoc-${BOWER_PANDOC_VERSION}"

      - name: Install pandoc
        run: |
          sudo install -m 755 ~/pandoc-bin/pandoc /usr/local/bin/pandoc
          pandoc --version

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Cache Claude Code CLI
        id: cache-claude-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/claude-cli
          key: claude-code-${{ runner.os }}-${{ env.CLAUDE_CODE_VERSION }}

      # Installed into a project-local prefix, not global, so the whole
      # thing is one directory the cache step above can save and restore.
      # Pinned to the version current when this workflow was written
      # (npm view @anthropic-ai/claude-code version); bump deliberately.
      - name: Install Claude Code
        if: steps.cache-claude-cli.outputs.cache-hit != 'true'
        run: npm install --prefix "$HOME/claude-cli" @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}

      - name: Add Claude Code to PATH
        run: echo "$HOME/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"

      # The run ticket and settings reach run.sh through a file, not the Run
      # step's environment: a process's initial environment stays readable in
      # /proc/<pid>/environ for its whole life, and the agent runs as a child
      # of run.sh's shell. printf is a shell builtin, so no value shows up in
      # a process list either. run.sh reads the file into shell variables and
      # deletes it before anything else (agent/README.md, "Runner settings").
      # The ticket comes from the dispatch, never from a secret: this job
      # holds no credential that works for another vault (issue #259). It is
      # masked, so it never shows in the log.
      - name: Hand the runner settings to run.sh
        env:
          BOWER_API_URL: ${{ vars.BOWER_API_URL }}
          BOWER_RUN_TICKET: ${{ github.event.client_payload.ticket }}
          # Unset by default: the agent gets no web tools (see run.sh).
          BOWER_ALLOW_WEB: ${{ vars.BOWER_ALLOW_WEB }}
          # Unset by default: run.sh falls back to the API's own maxTurns.
          BOWER_MAX_TURNS: ${{ vars.BOWER_MAX_TURNS }}
          # Unset by default: the agent runs on claude-sonnet-5-5, at low
          # effort for a plain tidy-up or a lint and high otherwise (see
          # run.sh, "model and effort"). Written only when set.
          BOWER_MODEL: ${{ vars.BOWER_MODEL }}
          BOWER_EFFORT_LOW: ${{ vars.BOWER_EFFORT_LOW }}
          BOWER_EFFORT_MEDIUM: ${{ vars.BOWER_EFFORT_MEDIUM }}
          BOWER_EFFORT_HIGH: ${{ vars.BOWER_EFFORT_HIGH }}
        run: |
          echo "::add-mask::$BOWER_RUN_TICKET"
          umask 077
          {
            printf 'BOWER_API_URL=%s\n' "$BOWER_API_URL"
            printf 'BOWER_RUN_TICKET=%s\n' "$BOWER_RUN_TICKET"
            printf 'BOWER_ALLOW_WEB=%s\n' "$BOWER_ALLOW_WEB"
            printf 'BOWER_MAX_TURNS=%s\n' "$BOWER_MAX_TURNS"
            if [ -n "$BOWER_MODEL" ]; then printf 'BOWER_MODEL=%s\n' "$BOWER_MODEL"; fi
            if [ -n "$BOWER_EFFORT_LOW" ]; then printf 'BOWER_EFFORT_LOW=%s\n' "$BOWER_EFFORT_LOW"; fi
            if [ -n "$BOWER_EFFORT_MEDIUM" ]; then printf 'BOWER_EFFORT_MEDIUM=%s\n' "$BOWER_EFFORT_MEDIUM"; fi
            if [ -n "$BOWER_EFFORT_HIGH" ]; then printf 'BOWER_EFFORT_HIGH=%s\n' "$BOWER_EFFORT_HIGH"; fi
          } >"$RUNNER_TEMP/bower-secrets"
          chmod 600 "$RUNNER_TEMP/bower-secrets"

      # Only the model credential is in this step's environment: the agent
      # needs it, so it can read it (docs/security.md, "What the runner
      # sees"). run.sh's own log carries timestamps, step names and counts
      # only and never prints a credential, so no ::add-mask:: is needed here.
      - name: Run lint
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash agent/run.sh "$VAULT_ID" lint

      # rclone's log and the agent's stderr, kept out of the job log itself
      # (see agent/README.md); may hold vault content, so this repo is
      # private and the retention is short.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bower-logs
          path: ${{ runner.temp }}/bower-logs/
          retention-days: 3
          if-no-files-found: ignore
