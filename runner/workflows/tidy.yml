# A tidy-up of one person's Bower folder, started by the Worker (worker contract, "Runner wire").
#
# This file lives in the instance repository as .github/workflows/tidy.yml; scripts/new-instance.sh copies it there
# with the built runner. It is kept out of this repository's own .github/workflows/ so the backup never runs Actions.
#
# - The Worker sends `repository_dispatch` of type bower-tidy with `{ run_id, attempt, ticket, scope, allow_web }`.
# - The run name is the one the Worker's recovery looks up; one concurrency group per run, never cancelled (R3).
# - The runner reads the dispatch from the event file Actions keeps at GITHUB_EVENT_PATH, so the ticket is never put
#   in the environment or the log; the runner masks it first. The ticket is the credential for Drive and the Worker.
# - The provider is the BOWER_PROVIDER variable (scripted when unset). The Claude provider (TL-P4-01) needs Claude
#   Code, installed pinned by version as the original's ingest.yml does, and the CLAUDE_CODE_OAUTH_TOKEN secret
#   (https://code.claude.com/docs/en/github-actions), the one secret this workflow reads: Actions masks it in the log,
#   and the runner hands it to claude's own environment only. It is set in the env of the one step that runs when
#   BOWER_PROVIDER is claude, never the job's (https://docs.github.com/en/actions/how-tos/write-workflows/
#   choose-what-workflows-do/use-secrets). BOWER_MODEL and BOWER_MAX_TURNS are optional variables.
# - The job's own token can only read this repository, to check out the runner.
# - The job runs on GitHub's ubuntu-latest unless the BOWER_RUNS_ON variable names another runner label, such as
#   self-hosted for a machine of the person's own (free of Actions minutes; https://docs.github.com/en/actions/
#   how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job). Only for a private repository.
# - On a self-hosted runner the Claude Code cache and the region steps are skipped (runner.environment): its home
#   keeps Claude Code between jobs, it has no Azure metadata service, and the timing line says region=self-hosted.
name: tidy
run-name: tidy ${{ github.event.client_payload.run_id }} ${{ github.event.client_payload.attempt }}

on:
  repository_dispatch:
    types: [bower-tidy]

permissions:
  contents: read

env:
  # Pinned to the version whose flags the runner was checked against (claude --help); bump deliberately.
  CLAUDE_CODE_VERSION: '2.1.293'

concurrency:
  group: tidy-${{ github.event.client_payload.run_id }}
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ${{ vars.BOWER_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: runner/dist
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # Claude Code is kept between runs by its pinned version, as the original's ingest.yml keeps its CLI
      # (https://github.com/actions/cache, v6 on Node 24 as its ci.yml pins it): restored on a hit, installed on a miss.
      # Skipped on a self-hosted runner, whose home keeps ~/claude-cli; the install then updates it in place.
      - name: Cache Claude Code
        id: cache-claude-cli
        if: vars.BOWER_PROVIDER == 'claude' && runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/claude-cli
          key: claude-code-${{ runner.os }}-${{ env.CLAUDE_CODE_VERSION }}
      - name: Install Claude Code
        if: vars.BOWER_PROVIDER == 'claude' && steps.cache-claude-cli.outputs.cache-hit != 'true'
        run: npm install --prefix "$HOME/claude-cli" "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Put Claude Code on the path
        if: vars.BOWER_PROVIDER == 'claude'
        run: printf '%s\n' "$HOME/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
      # The runner's Azure region, read from the instance metadata service as text
      # (https://learn.microsoft.com/en-us/azure/virtual-machines/instance-metadata-service). Any failure or a
      # non-region answer leaves BOWER_RUNNER_REGION unset (the timing line then says unknown); the step never fails the job.
      # Skipped on a self-hosted runner, which has no metadata service (the timing line then says self-hosted).
      - name: Record the runner region
        if: runner.environment == 'github-hosted'
        continue-on-error: true
        run: |
          region="$(curl -s -m 2 -H Metadata:true 'http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text' || true)"
          if printf '%s' "$region" | grep -qE '^[a-z0-9]+$'; then printf 'BOWER_RUNNER_REGION=%s\n' "$region" >> "$GITHUB_ENV"; fi
      # The scripted provider's step: no secret in its environment.
      - name: Tidy up
        if: vars.BOWER_PROVIDER != 'claude'
        env:
          BOWER_API_URL: ${{ vars.BOWER_API_URL }}
          BOWER_PROVIDER: ${{ vars.BOWER_PROVIDER }}
        run: node runner/dist/runner.mjs
      # The Claude provider's step: the only one the secret reaches (secrets set per step, in its env).
      - name: Tidy up with Claude
        if: vars.BOWER_PROVIDER == 'claude'
        env:
          BOWER_API_URL: ${{ vars.BOWER_API_URL }}
          BOWER_PROVIDER: ${{ vars.BOWER_PROVIDER }}
          BOWER_MODEL: ${{ vars.BOWER_MODEL }}
          BOWER_MAX_TURNS: ${{ vars.BOWER_MAX_TURNS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node runner/dist/runner.mjs
