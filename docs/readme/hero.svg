<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
<title id="t">Bower files your things</title>
<desc id="d">Bower, a teal bowerbird, picks up each thing waiting in the inbox (a link, a scanned PDF, a blog post, a photo) and carries it to a folder of your Drive: Projects, Areas, Resources or Archive, where it arrives with a name that says what it is.</desc>
