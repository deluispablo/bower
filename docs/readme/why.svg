<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
<title id="t">Collects, arranges, shows off</title>
<desc id="d">Three panels. Bower, a teal bowerbird, collects a blue bottle cap; arranges its finds by colour in front of a bower of twigs; then shows them off with its wing open.</desc>
<style>
.h{font:700 17px Poppins,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#f3f6fa}
.sub{font:400 14px 'Source Sans 3','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#9fabbf}
g[class^="rig-"],g[class^="head-"],g[class^="wing-"],g[class^="tuft-"]{transform-box:view-box}
.rig-1,.rig-2,.rig-3{transform-origin:50px 92px}
.head-1{transform-origin:60px 50px;animation:peck 3.2s ease-in-out infinite}
.rig-2{animation:hop 2.4s ease-in-out infinite}
.wing-3{transform-origin:56px 55px;animation:display 2.8s ease-in-out infinite}
.tuft-3{transform-origin:61px 23px;transform:rotate(16deg)}
.find{animation:glint 3s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
@keyframes peck{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-14deg)}75%{transform:rotate(4deg)}85%{transform:rotate(-8deg)}}
@keyframes hop{0%,40%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}60%{transform:translateY(0)}}
@keyframes display{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(-48deg)}}
@keyframes glint{0%,80%,100%{opacity:1}90%{opacity:.45}}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wing-3{transform:rotate(-40deg)}.spark{opacity:1}}
</style>
