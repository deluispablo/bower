<g fill="#5fcfbc">
<path d="M57 24Q52 14 59 15Q61 19 62 23Z"/>
<path d="M62 22Q62 11 68 14Q66 18 66 23Z"/>
</g>
<circle fill="#5fcfbc" cx="64" cy="36" r="15"/>
<ellipse fill="#ff9fb4" fill-opacity=".55" cx="73" cy="44" rx="3.2" ry="2"/>
<circle fill="#fff" cx="70" cy="34" r="6.4"/>
<circle fill="#1b2233" cx="70.6" cy="34" r="4.4"/>
<circle fill="none" stroke="#8e7cf3" stroke-width="1.1" cx="70.6" cy="34" r="3.8"/>
<circle fill="#fff" cx="72" cy="32.4" r="1.5"/>
<path fill="#d9952e" d="M78 38Q86 38 89 39Q85 42 78 41Z"/>
<path fill="#f0b64f" d="M78 31Q88 33 92 37Q86 38 78 38Z"/>
</g>
</g>
</g>
<path d="M90 158H870" stroke="#1f2b42" stroke-width="4" stroke-linecap="round"/>
<path class="prog" d="M90 158H870" stroke="#5fcfbc" stroke-width="4" stroke-linecap="round" fill="none"/>
<path d="M550 132Q480 96 410 132" fill="none" stroke="#f0b64f" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
<path d="M404 124L410 132L419 128" fill="none" stroke="#f0b64f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480" y="108" class="back" text-anchor="middle">changes asked</text>
<circle class="st" style="animation-name:s0" cx="90" cy="158" r="20" fill="#162034" stroke="#5fcfbc" stroke-width="3"/>
<text x="90" y="163" class="n" text-anchor="middle">1</text>
<text x="90" y="206" class="h" text-anchor="middle">A small task</text>
<text x="90" y="226" class="sub" text-anchor="middle">acceptance, paths, checks</text>
<circle class="st" style="animation-name:s1" cx="246" cy="158" r="20" fill="#162034" stroke="#5fcfbc" stroke-width="3"/>
<text x="246" y="163" class="n" text-anchor="middle">2</text>
<text x="246" y="206" class="h" text-anchor="middle">Tests first</text>
<text x="246" y="226" class="sub" text-anchor="middle">one failing test per line</text>
<circle class="st" style="animation-name:s2" cx="402" cy="158" r="20" fill="#162034" stroke="#5fcfbc" stroke-width="3"/>
<text x="402" y="163" class="n" text-anchor="middle">3</text>
<text x="402" y="206" class="h" text-anchor="middle">A fresh worker</text>
<text x="402" y="226" class="sub" text-anchor="middle">Claude Code or Codex</text>
<circle class="st" style="animation-name:s3" cx="558" cy="158" r="20" fill="#162034" stroke="#5fcfbc" stroke-width="3"/>
<text x="558" y="163" class="n" text-anchor="middle">4</text>
<text x="558" y="206" class="h" text-anchor="middle">Review</text>
<text x="558" y="226" class="sub" text-anchor="middle">by another agent</text>
<circle class="st" style="animation-name:s4" cx="714" cy="158" r="20" fill="#162034" stroke="#5fcfbc" stroke-width="3"/>
<text x="714" y="163" class="n" text-anchor="middle">5</text>
<text x="714" y="206" class="h" text-anchor="middle">The CI gate</text>
<text x="714" y="226" class="sub" text-anchor="middle">every check, in shards</text>
<circle class="st" style="animation-name:s5" cx="870" cy="158" r="20" fill="#162034" stroke="#5fcfbc" stroke-width="3"/>
<text x="870" y="163" class="n" text-anchor="middle">6</text>
<text x="870" y="206" class="h" text-anchor="middle">One merge</text>
<text x="870" y="226" class="sub" text-anchor="middle">per task, so bisect finds it</text>
<circle class="dot" cx="0" cy="0" r="7" fill="#f0b64f"/>
<g class="done"><circle cx="885" cy="143" r="9" fill="#5fcfbc"/><path d="M881 143l3 3 6-6" fill="none" stroke="#0b1220" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
