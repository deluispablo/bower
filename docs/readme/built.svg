<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="t d">
<title id="t">How each change gets in</title>
<desc id="d">Six steps, left to right: a small task with its acceptance, paths and checks; a failing test for each line of acceptance; a fresh worker, Claude Code or Codex, implements it; a review by another agent, which can send it back for changes; the CI gate runs every check in shards; then one merge per task. Bower, a teal bowerbird, watches from a twig.</desc>
<style>
.h{font:700 14px Poppins,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#f3f6fa}
.title{font:700 19px Poppins,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#f3f6fa;letter-spacing:-.01em}
.sub{font:400 12px 'Source Sans 3','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#9fabbf}
.lede{font:400 14px 'Source Sans 3','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#9fabbf}
.back{font:600 12px 'Source Sans 3','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#f0b64f}
.n{font:700 14px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dfe5ee}
.st{animation:10s linear infinite both}
.prog{stroke-dasharray:780;stroke-dashoffset:0;animation:prog 10s linear infinite}
.dot{opacity:0;transform:translate(870px,158px);animation:dot 10s linear infinite}
.done{animation:done 10s linear infinite}
.head{transform-box:view-box;transform-origin:60px 50px;animation:peck 3.2s ease-in-out infinite}
@keyframes s0{0%,92%{stroke:#5fcfbc}96%,100%{stroke:#3a4a66}}
@keyframes s1{0%,15.99%{stroke:#3a4a66}16%,92%{stroke:#5fcfbc}96%,100%{stroke:#3a4a66}}
@keyframes s2{0%,31.99%{stroke:#3a4a66}32%,92%{stroke:#5fcfbc}96%,100%{stroke:#3a4a66}}
@keyframes s3{0%,47.99%{stroke:#3a4a66}48%,92%{stroke:#5fcfbc}96%,100%{stroke:#3a4a66}}
@keyframes s4{0%,63.99%{stroke:#3a4a66}64%,92%{stroke:#5fcfbc}96%,100%{stroke:#3a4a66}}
@keyframes s5{0%,79.99%{stroke:#3a4a66}80%,92%{stroke:#5fcfbc}96%,100%{stroke:#3a4a66}}
@keyframes prog{0%{stroke-dashoffset:780;opacity:1}80%,92%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:780;opacity:0}}
@keyframes dot{0%{transform:translate(90px,158px);opacity:1}80%{transform:translate(870px,158px);opacity:1}84%,100%{transform:translate(870px,158px);opacity:0}}
@keyframes done{0%,79.9%{opacity:0}80%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes peck{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-14deg)}75%{transform:rotate(4deg)}85%{transform:rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="959" height="259" rx="18" fill="#111a2b" stroke="rgba(240,182,79,.26)"/>
<text x="32" y="46" class="title">How each change gets in</text>
<text x="32" y="70" class="lede">One coordinator, fresh workers, and a failing test before any code.</text>
