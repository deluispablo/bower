<ellipse fill="#b9ece2" cx="59" cy="73" rx="11" ry="8.5" transform="rotate(-30 59 73)"/>
<g>
<path fill="#2f9c8d" d="M58 52C66 56 64 70 54 74C44 78 32 76 24 72C32 68 40 58 58 52Z"/>
