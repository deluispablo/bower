<!doctype html>
<!--
  Served by Cloudflare Pages, with status 404, for a missing file under
  /assets/ (#992). Pages uses the closest 404.html to the requested path;
  with no top-level 404.html it keeps serving index.html for every other
  route, so deep links like /note/x still open the app. Without this file a
  missing chunk got index.html with status 200, which the service worker
  then stored as a script.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Not found</title>
  </head>
  <body>
    <p>Not found.</p>
  </body>
</html>
